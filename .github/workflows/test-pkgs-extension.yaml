name: Test pkgs package + extension (TEST, do not merge)

# Builds nvidia-tegra-nvgpu-pkg from the pkgs fork branch exactly as siderolabs/pkgs would
# (kernel signing key unchanged), pushes it to ghcr, then builds the nvidia-tegra-nvgpu
# extension from the extensions fork branch against it, which runs the extensions-validator.

on:
  workflow_dispatch:
    inputs:
      pkgs_ref:
        default: feat/nvidia-tegra-nvgpu-r39-firmware
        required: true
      extensions_ref:
        default: feat/nvidia-tegra-nvgpu-r39
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 340
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        run: |
          docker buildx create --name talos-builder --driver docker-container --use
          docker buildx inspect talos-builder --bootstrap

      - name: Build and push nvidia-tegra-nvgpu-pkg from the pkgs fork
        id: pkg
        run: |
          git clone --filter=blob:none --single-branch --branch "${{ inputs.pkgs_ref }}" https://github.com/schwankner/pkgs /tmp/pkgs
          cd /tmp/pkgs
          TAG="test-$(git rev-parse --short HEAD)"
          IMG="ghcr.io/${{ github.repository_owner }}/nvidia-tegra-nvgpu-pkg:${TAG}"
          CACHE="ghcr.io/${{ github.repository_owner }}/build-cache:pkgs-fork-nvgpu-$(awk '/^ +linux_version:/{print $2; exit}' Pkgfile)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          docker buildx build --builder talos-builder --file Pkgfile --target nvidia-tegra-nvgpu-pkg \
            --platform linux/arm64 --progress=plain \
            --cache-from "type=registry,ref=${CACHE}" --cache-to "type=registry,ref=${CACHE},mode=max" \
            --output "type=image,name=${IMG},push=true" .
          docker buildx build --builder talos-builder --file Pkgfile --target nvidia-tegra-nvgpu-pkg \
            --platform linux/arm64 --progress=plain --cache-from "type=registry,ref=${CACHE}" \
            --output "type=local,dest=/tmp/pkg-out" .
        timeout-minutes: 300

      - name: Check the package contents
        run: |
          cd /tmp/pkg-out
          find . -type f | sort | sed 's/^/  /'
          for m in nvgpu host1x host1x-fence host1x-nvhost nvhwpm tegra-drm nvmap mc-utils ivc_ext tegra_hv governor_pod_scaling; do
            find . -name "${m}.ko" | grep -q . || { echo "✗ ${m}.ko missing"; exit 1; }
          done
          for fw in gpmu_ucode_next_prod_image.bin pmu_pkc_prod_sig.bin fecs_encrypt_prod.bin gpccs_encrypt_prod.bin acr-gsp.text.encrypt.bin.prod; do
            test -s "usr/lib/firmware/nvidia/ga10b/${fw}" || { echo "✗ firmware ${fw} missing"; exit 1; }
          done
          test -f usr/lib/modprobe.d/nvidia-tegra.conf
          echo "✓ package contents"

      - name: Build the nvidia-tegra-nvgpu extension from the extensions fork
        run: |
          git clone --filter=blob:none --single-branch --branch "${{ inputs.extensions_ref }}" https://github.com/schwankner/extensions /tmp/ext
          cd /tmp/ext
          make local-nvidia-tegra-nvgpu PLATFORM=linux/arm64 PROGRESS=plain \
            PKGS_PREFIX=ghcr.io/${{ github.repository_owner }} PKGS=${{ steps.pkg.outputs.tag }} \
            DEST=/tmp/ext-out
          cd /tmp/ext-out
          cat manifest.yaml
          find rootfs -type f | sort | sed 's/^/  /' | head -80
          test -s rootfs/usr/lib/firmware/nvidia/ga10b/pmu_pkc_prod_sig.bin
          test -f rootfs/usr/local/lib/modprobe.d/nvidia-tegra.conf
          find rootfs -name nvgpu.ko | grep -q .
          echo "✓ extension built and validated"
