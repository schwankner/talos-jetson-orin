name: Build USB Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      jetpack:
        description: JetPack line to build (r36 = JetPack 6.x, r39 = JetPack 7.2, see docs/jetpack7.md)
        type: choice
        options: [both, r36, r39]
        default: both

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# workflow-level: must cover everything any job below needs
permissions:
  contents: write
  packages: write

jobs:
  # ── Job 0: which JetPack lines this run builds ─────────────────────────────
  # Tag pushes, the auto-tag dispatch (no input) and jetpack=both build r36 and r39 from the
  # same Talos bump: r36 -> custom-installer, r39 -> custom-installer-jp7.
  plan:
    name: Select JetPack lines
    runs-on: ubuntu-latest
    outputs:
      lines: ${{ steps.p.outputs.lines }}
    steps:
      - id: p
        env:
          JETPACK_INPUT: ${{ inputs.jetpack || 'both' }}
        run: |
          case "${JETPACK_INPUT}" in
            both)    echo 'lines=["r36","r39"]' >> "$GITHUB_OUTPUT" ;;
            r36|r39) echo "lines=[\"${JETPACK_INPUT}\"]" >> "$GITHUB_OUTPUT" ;;
            *)       echo "unknown jetpack '${JETPACK_INPUT}'" >&2; exit 1 ;;
          esac

  # ── Job 1: Build kernel + GPU extensions (skips automatically if cached) ───
  # One line at a time, r36 first: the kernel, kernel-modules-clang and the base installer are
  # shared, and the r39 build reuses them from the registry (scripts/build-extensions.sh)
  # instead of compiling the kernel again and racing the r36 run for the same tags.
  build-extensions:
    name: Build extensions (${{ matrix.jetpack }})
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        jetpack: ${{ fromJSON(needs.plan.outputs.lines) }}
    uses: ./.github/workflows/build-extensions.yaml
    with:
      jetpack: ${{ matrix.jetpack }}
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # ── Job 2: Assemble UKI + USB image ────────────────────────────────────────
  # `!cancelled()`: a failed r39 extension build must not block the r36 image (and vice versa);
  # a leg whose own extensions are missing fails on the image pull.
  build-usb:
    name: Assemble UKI + USB image (${{ matrix.jetpack }})
    needs: [plan, build-extensions]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        jetpack: ${{ fromJSON(needs.plan.outputs.lines) }}
    runs-on: ubuntu-26.04-arm   # native arm64 — no QEMU needed
    env:
      # picked up by scripts/common.sh in every step below (versions, image tags, output names)
      JETPACK: ${{ matrix.jetpack }}

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Restore signing keys
        env:
          SIGNING_KEY_PEM: ${{ secrets.SIGNING_KEY_PEM }}
          SIGNING_KEY_X509: ${{ secrets.SIGNING_KEY_X509 }}
        run: |
          mkdir -p keys
          printf '%s' "${SIGNING_KEY_PEM}"  > keys/signing_key.pem
          printf '%s' "${SIGNING_KEY_X509}" > keys/signing_key.x509
          chmod 600 keys/signing_key.pem

      - name: Build UKI + USB image
        run: make usb
        timeout-minutes: 30
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          REGISTRY_DOCKER: ghcr.io/${{ github.repository_owner }}

      - name: Build versioned installer image for talosctl upgrade
        # Produces <installer repo>:<talos>-<kernel>-nvgpu<nvgpu> (custom-installer for r36,
        # custom-installer-jp7 for r39) — the full installer
        # with all extensions embedded. Required by `talosctl upgrade --image ...`.
        # The bare custom-installer:<talos>-<kernel> (no nvgpu suffix) built by
        # build-extensions.sh is only the base kernel; this step bakes the
        # extensions in via the Talos imager output.kind=installer.
        run: |
          source scripts/common.sh
          INSTALLER_TAG="ghcr.io/${{ github.repository_owner }}/${INSTALLER_REPO}:${TALOS_VERSION}-${KERNEL_VERSION}-nvgpu${NVGPU_VERSION}"
          CUSTOM_IMAGER_TAG="custom-imager:${TALOS_VERSION}-llvm"
          INSTALLER_OUT="$(pwd)/dist/installer-out"
          mkdir -p "${INSTALLER_OUT}"

          # Same profile as build-uki.sh but output.kind=installer + outFormat=docker
          PROFILE=$(cat <<EOF
          arch: arm64
          platform: metal
          secureboot: false
          version: ${TALOS_VERSION}
          input:
            kernel:
              path: /usr/install/arm64/vmlinuz
            initramfs:
              path: /usr/install/arm64/initramfs.xz
            sdStub:
              path: /usr/install/arm64/systemd-stub.efi
            sdBoot:
              path: /usr/install/arm64/systemd-boot.efi
            baseInstaller:
              imageRef: ghcr.io/${{ github.repository_owner }}/custom-installer:${TALOS_VERSION}-${KERNEL_VERSION}
              forceInsecure: false
            systemExtensions:
              - imageRef: ghcr.io/${{ github.repository_owner }}/kernel-modules-clang:${KERNEL_MODULES_VERSION}-${KERNEL_VERSION}-talos
                forceInsecure: false
              - imageRef: ghcr.io/${{ github.repository_owner }}/nvidia-tegra-nvgpu:${NVGPU_VERSION}-${KERNEL_VERSION}-talos
                forceInsecure: false
              - imageRef: ghcr.io/${{ github.repository_owner }}/nvidia-firmware-ext:${FIRMWARE_EXT_TAG}
                forceInsecure: false
          customization:
            extraKernelArgs:
              # Serial console for UART debug.
              - console=ttyTCU0,115200
              # Local console on the active framebuffer/DRM device (HDMI or DP).
              - console=tty0
              - firmware_class.path=/usr/lib/firmware
          output:
            kind: installer
            outFormat: raw
          EOF
          )

          echo "${PROFILE}" | docker run --rm -i \
            --platform linux/arm64 \
            --add-host host.docker.internal:host-gateway \
            -v "${INSTALLER_OUT}:/out" \
            -v "${HOME}/.docker/config.json:/root/.docker/config.json:ro" \
            "${CUSTOM_IMAGER_TAG}" \
            -

          echo "Installer imager output:"
          ls -lh "${INSTALLER_OUT}/"

          # Talos imager produces installer-arm64.tar (outFormat: raw keeps .tar extension)
          # The tar embeds the baseInstaller imageRef tag as the image name
          INSTALLER_TAR="${INSTALLER_OUT}/installer-arm64.tar"
          [[ -f "${INSTALLER_TAR}" ]] \
            || { echo "ERROR: installer-arm64.tar not found; files:"; ls "${INSTALLER_OUT}/"; exit 1; }

          docker load < "${INSTALLER_TAR}"

          # Imager embeds baseInstaller imageRef as the loaded tag:
          # ghcr.io/<owner>/custom-installer:<talos>-<kernel>  (base, no nvgpu suffix)
          LOADED_TAG="ghcr.io/${{ github.repository_owner }}/custom-installer:${TALOS_VERSION}-${KERNEL_VERSION}"
          if ! docker image inspect "${LOADED_TAG}" >/dev/null 2>&1; then
            # Fallback: search for any recently-loaded installer image
            LOADED_TAG=$(docker images --format "{{.Repository}}:{{.Tag}}" \
              | grep "installer" | grep "${TALOS_VERSION}" | head -1)
            [[ -n "${LOADED_TAG}" ]] \
              || { echo "ERROR: could not find loaded installer image"; docker images; exit 1; }
          fi

          docker tag "${LOADED_TAG}" "${INSTALLER_TAG}"
          docker push "${INSTALLER_TAG}"
          echo "✓ Pushed: ${INSTALLER_TAG}"

          # Alias tag: <installer repo>:<talos> (the plain Talos version, for example v1.14.2)
          # on the same image. Upgrade controllers such as tuppr derive the target image by
          # swapping the version tag of the node's current install image and verify the node
          # against that tag, so they need a tag that is exactly the Talos version. The
          # compound tag above stays the build's identity (kernel, nvgpu). Each JetPack line
          # has its own installer repository, so an alias never crosses lines: a r39 node
          # that follows custom-installer-jp7:<talos> cannot be moved to the r36 image.
          # The alias is mutable: it names the latest build of that Talos version.
          ALIAS_TAG="ghcr.io/${{ github.repository_owner }}/${INSTALLER_REPO}:${TALOS_VERSION}"
          docker tag "${INSTALLER_TAG}" "${ALIAS_TAG}"
          docker push "${ALIAS_TAG}"
          echo "✓ Pushed alias: ${ALIAS_TAG} -> ${INSTALLER_TAG}"
        env:
          REGISTRY: ghcr.io/${{ github.repository_owner }}
          REGISTRY_DOCKER: ghcr.io/${{ github.repository_owner }}

      - name: Locate produced image
        id: img
        run: |
          RAW=$(ls dist/*.raw dist/*.raw.zst 2>/dev/null | head -1)
          echo "path=${RAW}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${RAW}")" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      # Sanitize ref_name: actions/upload-artifact rejects '/' (and other FS-
      # unsafe chars), but branch names like 'feat/no-shim-test' contain '/'.
      # Replace '/' with '-' so workflow_dispatch on a topic branch succeeds.
      - name: Sanitize branch name for artifact
        id: ref
        run: echo "safe=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload USB image as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: talos-jetson-usb-${{ steps.ref.outputs.safe }}${{ matrix.jetpack == 'r39' && '-r39' || '' }}
          path: ${{ steps.img.outputs.path }}
          retention-days: 30

  # ── Job 3: one GitHub Release with the image of every line that was built ───
  release:
    name: Create GitHub Release
    needs: build-usb
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download USB images
        uses: actions/download-artifact@v7
        with:
          pattern: talos-jetson-usb-*
          path: usb
          merge-multiple: true

      - name: Write release notes
        run: |
          ls -lh usb/
          {
            echo "## USB boot images — ${GITHUB_REF_NAME}"
            echo
            echo "**One image per JetPack line for the entire Jetson Orin family.**"
            echo
            echo "All Orin modules use the same T234 SoC with GA10B GPU and boot via UEFI (EDK2 in SPI"
            echo "flash). The DTB is loaded from the board's own SPI flash — no board-specific build"
            echo "needed. Flash an image to a USB stick and boot any Orin module."
            echo
            echo "| Line | Image | Installer (for \`talosctl upgrade\`) | nvidia-tegra-nvgpu |"
            echo "|------|-------|-------------------------------------|--------------------|"
            for line in r36 r39; do
              ( export JETPACK="${line}"; source scripts/common.sh
                img=$(ls usb/talos-usb-nvgpu${NVGPU_VERSION}.raw* 2>/dev/null | head -1 || true)
                [ -n "${img}" ] || exit 0
                inst="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${INSTALLER_REPO}:${TALOS_VERSION}-${KERNEL_VERSION}-nvgpu${NVGPU_VERSION}"
                label="r36 — JetPack 6.x (default)"; [ "${line}" = r39 ] && label="r39 — JetPack 7.2 (CUDA 13)"
                echo "| ${label} | \`$(basename "${img}")\` | \`${inst}\` | \`${NVGPU_VERSION}\` |"
              )
            done
            echo
            source scripts/common.sh
            echo "Talos Linux \`${TALOS_VERSION}\`, Linux kernel \`${KERNEL_VERSION}\`."
            echo
            echo "The r39 line needs JetPack 7 firmware in the board's QSPI — see docs/jetpack7.md before flashing."
            echo
            echo "### Flash"
            echo '```bash'
            echo "# macOS (replace N with disk number from: diskutil list)"
            echo "sudo dd if=<image>.raw of=/dev/rdiskN bs=4m && sync"
            echo "# Linux (replace X with your USB drive from: lsblk)"
            echo "sudo dd if=<image>.raw of=/dev/sdX bs=4M status=progress && sync"
            echo '```'
            echo
            echo "See [README](https://github.com/${GITHUB_REPOSITORY}#readme) for full setup instructions."
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: "Talos Jetson Orin — ${{ github.ref_name }}"
          body_path: release-notes.md
          files: usb/*
