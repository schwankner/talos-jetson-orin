# Talos machine config patch — Jetson Orin (all SKUs), JetPack 7.2 / r39 (default line)
#
# Sets installer image + kernel module load order for the r39 GPU stack.
# Apply together with machine-patch-cdi.yaml for full GPU container support.
# The r36 (JetPack 6) line uses machine-patch-r36.yaml instead (see README, "Two driver lines").
#
# How to apply (fresh install, maintenance mode):
#   talosctl apply-config --insecure --nodes <jetson-ip> \
#     --file controlplane.yaml \
#     --config-patch @manifests/talos/machine-patch.yaml \
#     --config-patch @manifests/talos/machine-patch-cdi.yaml
#
# How to apply (running node, no-reboot):
#   talosctl apply-config --nodes <jetson-ip> --talosconfig ./talosconfig \
#     --file controlplane.yaml \
#     --config-patch @manifests/talos/machine-patch.yaml \
#     --config-patch @manifests/talos/machine-patch-cdi.yaml \
#     --mode=no-reboot
machine:
  # kexec_file_load fails on Jetson Orin. Talos up to v1.14.4 then reverts an upgrade
  # to the previous UKI while reporting success (BUGS.md Bug 25; fixed in v1.14.5).
  # With kexec disabled, upgrades from older versions reboot through the firmware
  # into the new image.
  sysctls:
    kernel.kexec_load_disabled: "1"
  install:
    disk: /dev/nvme0n1
    image: ghcr.io/schwankner/custom-installer-jp7:v1.14.7-6.18.65-nvgpu39.2.1-jp7-2
    wipe: false
  kernel:
    modules:
      # Hypervisor helpers: NVIDIA's kernel has these built in, the Talos kernel does not.
      # On bare metal they only have to be loaded (nvgpu, tegra-drm and nvmap use their exports).
      - name: ivc_ext
      - name: tegra_hv
      # host1x stack (prerequisite for all GPU modules)
      - name: host1x
      - name: host1x_nvhost
      - name: host1x_fence
      # hardware performance monitor (tegra-drm depends on it)
      - name: nvhwpm
      # headless DRM — creates /dev/dri/renderD128 (required for CUDA via libcuda.so)
      - name: tegra_drm
      # GPU memory + bandwidth
      - name: nvmap
      - name: mc_utils
      # Main CUDA driver (GA10B / Ampere)
      - name: nvgpu
      # GPU frequency scaling governor
      - name: governor_pod_scaling
